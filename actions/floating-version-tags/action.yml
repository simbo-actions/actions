name: Floating Version Tags

description: A GitHub Action to move floating version tags like v1 forward to a release, safely - forward only, never to prereleases.

author: Simon Lepel <simbo@simbo.de> (https://simbo.de/)

branding:
  icon: tag
  color: green

inputs:
  token:
    description: >
      The token to authenticate with. Needs "contents: write" on the repository.
    required: true
  repository:
    description: The repository of the tags, in the format "owner/repo".
    required: false
    default: ${{ github.repository }}
  tag:
    description: >
      The existing release tag, for example "v1.2.3" or, with a prefix,
      "my-package/v1.2.3". Defaults to the tag the workflow runs for (a tag push
      or a release). Prereleases are rejected.
    required: false
    default: ''
  prefix:
    description: >
      A prefix of the version tags, for example "my-package/" for tags like
      "my-package/v1.2.3"; the floating tags get the same prefix.
    required: false
    default: ''
  v-prefix:
    description: >
      Whether versions start with "v". With "false", the tag "1.2.3" moves the
      floating tag "1".
    required: false
    default: 'true'
  major:
    description: Whether to move the major tag "vX".
    required: false
    default: 'true'
  minor:
    description: Whether to move the minor tag "vX.Y".
    required: false
    default: 'false'
  latest:
    description: Whether to move the tag "latest".
    required: false
    default: 'false'
  annotated:
    description: >
      Whether to create the floating tags as annotated tags with a message, for
      example "v1 → v1.4.2 (latest stable release of major version 1)", instead
      of lightweight tags.
    required: false
    default: 'false'
  dry-run:
    description: Whether to only report the changes without writing them.
    required: false
    default: 'false'

outputs:
  moved:
    description: 'The floating tags that were created or moved, as JSON array, for example ["v1"].'

runs:
  using: node24
  main: dist/index.js
