name: GitHub App Credentials

description: A GitHub Action to obtain token, slug, user ID, name, and email for a GitHub App.

author: Simon Lepel <simbo@simbo.de> (https://simbo.de/)

branding:
  icon: user-check
  color: blue

inputs:
  app-id:
    description: The GitHub App ID (use either `app-id` or `client-id`)
    required: false
    default: ''
  client-id:
    description: The GitHub App client ID (use either `app-id` or `client-id`)
    required: false
    default: ''
  app-private-key:
    description: The GitHub App private key in PEM format
    required: true
  owner:
    description: The GitHub App installation owner (user or organization)
    required: false
    default: ${{ github.repository_owner }}
  repositories:
    description: >
      Comma or newline separated list of repositories the token is restricted
      to. Defaults to the current repository if `owner` is the current
      repository owner, otherwise to all repositories of the installation. Use
      `*` for all repositories of the installation.
    required: false
    default: ''
  permission-actions:
    description: Permission for GitHub Actions (`read` or `write`)
    required: false
  permission-administration:
    description: Permission for repository administration (`read` or `write`)
    required: false
  permission-artifact-metadata:
    description: Permission for artifact metadata (`read` or `write`)
    required: false
  permission-attestations:
    description: Permission for attestations (`read` or `write`)
    required: false
  permission-checks:
    description: Permission for checks (`read` or `write`)
    required: false
  permission-contents:
    description: Permission for contents (`read` or `write`)
    required: false
  permission-deployments:
    description: Permission for deployments (`read` or `write`)
    required: false
  permission-discussions:
    description: Permission for discussions (`read` or `write`)
    required: false
  permission-environments:
    description: Permission for environments (`read` or `write`)
    required: false
  permission-issues:
    description: Permission for issues (`read` or `write`)
    required: false
  permission-packages:
    description: Permission for packages (`read` or `write`)
    required: false
  permission-pages:
    description: Permission for pages (`read` or `write`)
    required: false
  permission-pull-requests:
    description: Permission for pull requests (`read` or `write`)
    required: false
  permission-repository-custom-properties:
    description: Permission for repository custom properties (`read` or `write`)
    required: false
  permission-secrets:
    description: Permission for repository secrets (`read` or `write`)
    required: false
  permission-security-events:
    description: Permission for security events (`read` or `write`)
    required: false
  permission-statuses:
    description: Permission for commit statuses (`read` or `write`)
    required: false
  permission-vulnerability-alerts:
    description: Permission for Dependabot alerts (`read` or `write`)
    required: false
  permission-workflows:
    description: Permission for workflow files (`write`)
    required: false

outputs:
  token:
    description: The GitHub App token
    value: ${{ steps.app-token-client-id.outputs.token || steps.app-token-app-id.outputs.token }}
  slug:
    description: The GitHub App slug
    value: ${{ steps.app-token-client-id.outputs.app-slug || steps.app-token-app-id.outputs.app-slug }}
  id:
    description: The GitHub App user ID
    value: ${{ steps.app-user-id.outputs.user-id }}
  name:
    description: The GitHub App user name
    value: ${{ steps.app-name-email.outputs.name }}
  email:
    description: The GitHub App user email
    value: ${{ steps.app-name-email.outputs.email }}

runs:
  using: 'composite'
  steps:
    - name: 🧐 Prepare Inputs
      id: options
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        CLIENT_ID: ${{ inputs.client-id }}
        PRIVATE_KEY: ${{ inputs.app-private-key }}
        OWNER: ${{ inputs.owner }}
        REPOSITORIES: ${{ inputs.repositories }}
      run: |
        set -euo pipefail

        while IFS= read -r line; do
          if [[ -n "$line" ]]; then
            echo "::add-mask::${line}"
          fi
        done <<< "$PRIVATE_KEY"

        if [[ -z "$APP_ID" && -z "$CLIENT_ID" ]]; then
          echo "::error title=Missing App Identifier::Either app-id or client-id is required."
          exit 1
        fi

        if [[ -n "$APP_ID" && -n "$CLIENT_ID" ]]; then
          echo "::error title=Ambiguous App Identifier::Use either app-id or client-id, not both."
          exit 1
        fi

        if [[ "$REPOSITORIES" == '*' ]]; then
          repositories=''
        elif [[ -z "$REPOSITORIES" && "$OWNER" == "$GITHUB_REPOSITORY_OWNER" ]]; then
          repositories="${GITHUB_REPOSITORY#*/}"
        else
          repositories="$REPOSITORIES"
        fi

        {
          echo 'repositories<<EOF'
          echo "$repositories"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: 🔑 Get App Token (Client ID)
      if: inputs.client-id != ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token-client-id
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ steps.options.outputs.repositories }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-artifact-metadata: ${{ inputs.permission-artifact-metadata }}
        permission-attestations: ${{ inputs.permission-attestations }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-deployments: ${{ inputs.permission-deployments }}
        permission-discussions: ${{ inputs.permission-discussions }}
        permission-environments: ${{ inputs.permission-environments }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-packages: ${{ inputs.permission-packages }}
        permission-pages: ${{ inputs.permission-pages }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-repository-custom-properties: ${{ inputs.permission-repository-custom-properties }}
        permission-secrets: ${{ inputs.permission-secrets }}
        permission-security-events: ${{ inputs.permission-security-events }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-vulnerability-alerts: ${{ inputs.permission-vulnerability-alerts }}
        permission-workflows: ${{ inputs.permission-workflows }}

    - name: 🔑 Get App Token (App ID)
      if: inputs.client-id == ''
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app-token-app-id
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ steps.options.outputs.repositories }}
        permission-actions: ${{ inputs.permission-actions }}
        permission-administration: ${{ inputs.permission-administration }}
        permission-artifact-metadata: ${{ inputs.permission-artifact-metadata }}
        permission-attestations: ${{ inputs.permission-attestations }}
        permission-checks: ${{ inputs.permission-checks }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-deployments: ${{ inputs.permission-deployments }}
        permission-discussions: ${{ inputs.permission-discussions }}
        permission-environments: ${{ inputs.permission-environments }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-packages: ${{ inputs.permission-packages }}
        permission-pages: ${{ inputs.permission-pages }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
        permission-repository-custom-properties: ${{ inputs.permission-repository-custom-properties }}
        permission-secrets: ${{ inputs.permission-secrets }}
        permission-security-events: ${{ inputs.permission-security-events }}
        permission-statuses: ${{ inputs.permission-statuses }}
        permission-vulnerability-alerts: ${{ inputs.permission-vulnerability-alerts }}
        permission-workflows: ${{ inputs.permission-workflows }}

    - name: 🪪 Get App User ID
      id: app-user-id
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token-client-id.outputs.token || steps.app-token-app-id.outputs.token }}
        SLUG: ${{ steps.app-token-client-id.outputs.app-slug || steps.app-token-app-id.outputs.app-slug }}
      run: |
        set -euo pipefail
        userId=$(gh api "/users/${SLUG}[bot]" --jq .id)
        echo "user-id=${userId}" >> "$GITHUB_OUTPUT"

    - name: 📧 Get App Name and Email
      id: app-name-email
      shell: bash
      env:
        SLUG: ${{ steps.app-token-client-id.outputs.app-slug || steps.app-token-app-id.outputs.app-slug }}
        USER_ID: ${{ steps.app-user-id.outputs.user-id }}
      run: |
        set -euo pipefail
        echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
        echo "email=${USER_ID}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
