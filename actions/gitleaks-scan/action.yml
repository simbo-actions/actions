name: Gitleaks Scan

description: A GitHub Action to scan the Git history for secrets with Gitleaks, from a pinned and checksum-verified binary, in one step.

author: Simon Lepel <simbo@simbo.de> (https://simbo.de/)

branding:
  icon: shield
  color: green

inputs:
  working-directory:
    description: >
      The Git repository to scan. Check it out with "fetch-depth: 0", so that
      all commits to scan are there.
    required: false
    default: .
  scope:
    description: >
      What to scan: "auto" (the commits of a pull request, merge group, or push;
      the whole history for other events), "changes" (like "auto", but fails for
      other events), "history" (all commits), or "files" (the files of the
      working tree).
    required: false
    default: auto
  log-opts:
    description: >
      Options for "git log" that select the commits to scan, for example
      "--since=2024-01-01". Override "scope"; not allowed with the scope
      "files".
    required: false
    default: ''
  config:
    description: >
      A Gitleaks configuration file, relative to "working-directory". Defaults
      to ".gitleaks.toml" in "working-directory" if it exists, otherwise the
      default rules of Gitleaks.
    required: false
    default: ''
  baseline-path:
    description: >
      A Gitleaks report, relative to "working-directory", whose findings are
      ignored, for example accepted findings of an older history.
    required: false
    default: ''
  fail-on-findings:
    description: >
      Whether findings fail the action. With "false", they are reported as
      warnings.
    required: false
    default: 'true'

outputs:
  findings:
    description: The number of findings.
  scanned:
    description: >
      What was scanned, for example "changes abc1234..def5678 (3 commits)",
      "history", or "files".
  sarif-file:
    description: The path of the SARIF report, for example to upload it to code scanning.

runs:
  using: node24
  main: dist/index.js
