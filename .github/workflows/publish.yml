name: Publish 🚚

#-------------------------------------------------------------------------------
# "Publish" Workflow
#
# Publishes built action packages to their respective GitHub repositories.
#-------------------------------------------------------------------------------

on:
  push:
    tags:
      - '*/v*.*.*'
      - '!changelog/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package Name'
        required: true
      version:
        description: 'Version'
        required: true

permissions: {}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'workflow_dispatch'
          && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
          || github.ref_name
      )
    }}

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    )
  }}

env:
  REF_NAME: >
    ${{ github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    }}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🔍 Parse Options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: options
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package || '' }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        with:
          script: |
            let package, version, ref;

            const event = process.env.EVENT_NAME;
            switch (event) {
              case 'workflow_dispatch':
                package = process.env.PACKAGE.trim();
                version = process.env.VERSION.trim();
                ref = `${package}/v${version}`;
                break;
              case 'push':
                ref = process.env.REF_NAME.trim();
                const parts = ref.split('/v');
                package = parts[0].trim();
                version = parts[1].trim();
                break;
              default:
                throw new Error(`Unsupported event: ${event}`);
            }

            if (!/^[\w-]+$/.test(package)) {
              throw new Error(`Invalid package name: "${package}"`);
            }
            if (!/^\d+\.\d+\.\d+(-.+)?$/.test(version)) {
              throw new Error(`Invalid version: "${version}"`);
            }
            if (ref !== `${package}/v${version}`) {
              throw new Error(`Invalid ref: "${ref}" (expected: "${package}/v${version}")`);
            }

            core.setOutput('package', package);
            core.setOutput('version', version);
            core.setOutput('ref', ref);

      - name: 🛎️ Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monorepo
          ref: refs/tags/${{ steps.options.outputs.ref }}
          persist-credentials: false

      - name: 🚛 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: monorepo/package.json

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml

      - name: 📥 Install
        working-directory: monorepo
        run: pnpm install --frozen-lockfile

      - name: 👷 Build
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm run --filter "$PACKAGE" --if-present build

      - name: 🎁 Bundle
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm run --filter "$PACKAGE" --if-present bundle

      - name: 🔍 Check Action Repository
        id: repo-exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository_owner }}/${{ steps.options.outputs.package }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}" --silent 2>/dev/null; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🪪 Retrieve Credentials (Administration)
        id: credentials-admin
        if: steps.repo-exists.outputs.result == 'false'
        uses: ./monorepo/actions/github-app-credentials
        with:
          app-id: ${{ secrets.SIMBO_ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: '*'
          permission-administration: write

      - name: 🪄 Create Action Repository
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.options.outputs.package }}
        with:
          github-token: ${{ steps.credentials-admin.outputs.token }}
          script: |
            await github.rest.repos.createInOrg({
              org: process.env.OWNER.trim(),
              name: process.env.PACKAGE.trim(),
              private: false,
              auto_init: true,
              has_wiki: false,
              has_projects: false,
            });

      - name: 🪪 Retrieve Credentials (Contents)
        id: credentials
        uses: ./monorepo/actions/github-app-credentials
        with:
          app-id: ${{ secrets.SIMBO_ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ steps.options.outputs.package }}
          permission-contents: write

      - name: 🛎️ Checkout Action Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.credentials.outputs.token }}
          repository: ${{ github.repository_owner }}/${{ steps.options.outputs.package }}
          path: action-repo
          ref: main

      - name: 🧩 Integrate Built Artifacts
        env:
          FROM: monorepo/actions/${{ steps.options.outputs.package }}
          TO: action-repo
        run: |
          set -euo pipefail

          # Clean the destination directory
          find "$TO" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Copy distribution artifacts
          if [[ -d "${FROM}/dist" ]]; then
            cp -R "${FROM}/dist" "${TO}/"
          fi
          cp "${FROM}/README.md" "${TO}/"
          cp "${FROM}/CHANGELOG.md" "${TO}/"
          cp "${FROM}/action.yml" "${TO}/"
          cp "${FROM}/package.json" "${TO}/"
          cp "monorepo/LICENSE.md" "${TO}/"

      - name: 💾 Commit & Push Changes
        uses: ./monorepo/actions/commit-and-push
        with:
          path: action-repo
          ref: main
          add: '-A'
          name: ${{ steps.credentials.outputs.name }}
          email: ${{ steps.credentials.outputs.email }}
          message: 'ci(release): v${{ steps.options.outputs.version }}'
          tags: v${{ steps.options.outputs.version }}
