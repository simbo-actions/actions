name: Publish 🚚

#-------------------------------------------------------------------------------
# "Publish" Workflow
#
# Publishes a released action to its own repository "simbo-actions/<action>":
# builds the action, creates and configures the repository if necessary,
# commits the build artifacts as signed commit with the tag "v<version>", and
# creates a GitHub release (draft, assets, publish).
#
# Order matters: all third-party code (install, build) runs before the app
# credentials are retrieved. Every token is restricted to the repository and
# the permissions of the steps that use it.
#-------------------------------------------------------------------------------

on:
  push:
    tags:
      - '*/v*.*.*'
      - '!changelog/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package Name'
        required: true
      version:
        description: 'Version'
        required: true

permissions: {}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'workflow_dispatch'
          && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
          || github.ref_name
      )
    }}

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    )
  }}

env:
  REF_NAME: >
    ${{ github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    }}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🔍 Parse Options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: options
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package || '' }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        with:
          script: |
            let package, version, ref;

            const event = process.env.EVENT_NAME;
            switch (event) {
              case 'workflow_dispatch':
                package = process.env.PACKAGE.trim();
                version = process.env.VERSION.trim();
                ref = `${package}/v${version}`;
                break;
              case 'push':
                ref = process.env.REF_NAME.trim();
                const parts = ref.split('/v');
                package = parts[0].trim();
                version = parts[1].trim();
                break;
              default:
                throw new Error(`Unsupported event: ${event}`);
            }

            if (!/^[\w-]+$/.test(package) || package === 'changelog') {
              throw new Error(`Invalid package name: "${package}"`);
            }
            if (!/^\d+\.\d+\.\d+(-.+)?$/.test(version)) {
              throw new Error(`Invalid version: "${version}"`);
            }
            if (ref !== `${package}/v${version}`) {
              throw new Error(`Invalid ref: "${ref}" (expected: "${package}/v${version}")`);
            }

            core.setOutput('package', package);
            core.setOutput('version', version);
            core.setOutput('ref', ref);
            core.setOutput('tag', `v${version}`);
            core.setOutput('repository', `${process.env.OWNER}/${package}`);

      - name: 🛎️ Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monorepo
          ref: refs/tags/${{ steps.options.outputs.ref }}
          persist-credentials: false

      - name: 🚛 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: monorepo/package.json

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml

      - name: 📥 Install
        working-directory: monorepo
        run: pnpm install --frozen-lockfile

      - name: 👷 Build
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm run --filter "$PACKAGE" --filter signed-commit --if-present build

      - name: 🎁 Bundle
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm run --filter "$PACKAGE" --if-present bundle

      - name: 🧩 Assemble Release Content
        id: content
        env:
          FROM: monorepo/actions/${{ steps.options.outputs.package }}
          PACKAGE: ${{ steps.options.outputs.package }}
          VERSION: ${{ steps.options.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! -f "${FROM}/action.yml" ]]; then
            echo "::error title=Not an Action::${FROM}/action.yml does not exist."
            exit 1
          fi

          content="${RUNNER_TEMP}/release/content"
          assets="${RUNNER_TEMP}/release/assets"
          notes="${RUNNER_TEMP}/release/notes.md"
          mkdir -p "$content" "$assets"

          # Copy distribution artifacts
          if [[ -d "${FROM}/dist" ]]; then
            cp -R "${FROM}/dist" "${content}/"
          fi
          cp "${FROM}/README.md" "${FROM}/CHANGELOG.md" "${FROM}/action.yml" "${FROM}/package.json" "${content}/"
          cp monorepo/LICENSE.md "${content}/"

          # Create release assets
          archive="${PACKAGE}-v${VERSION}.tar.gz"
          tar --create --gzip --file "${assets}/${archive}" --directory "$content" --sort=name --owner=0 --group=0 --numeric-owner .
          (cd "$assets" && sha256sum "$archive" > SHA256SUMS)

          # Extract the release notes of this version from the changelog
          awk -v version="$VERSION" '
            $0 ~ "^## " version "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "${FROM}/CHANGELOG.md" > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "::error title=Missing Release Notes::No changelog section found for version ${VERSION}."
            exit 1
          fi

          echo "content=${content}" >> "$GITHUB_OUTPUT"
          echo "assets=${assets}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: 🔍 Check Action Repository
        id: repo-exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.options.outputs.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}" --silent 2>/dev/null; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🪪 Retrieve Credentials (Create Repository)
        id: credentials-create
        if: steps.repo-exists.outputs.result == 'false'
        uses: ./monorepo/actions/github-app-credentials
        with:
          app-id: ${{ secrets.SIMBO_ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: 🪄 Create Action Repository
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.options.outputs.package }}
          PACKAGE_JSON: monorepo/actions/${{ steps.options.outputs.package }}/package.json
        with:
          github-token: ${{ steps.credentials-create.outputs.token }}
          script: |
            const { readFile } = await import('node:fs/promises');
            const { description } = JSON.parse(await readFile(process.env.PACKAGE_JSON, 'utf8'));
            await github.rest.repos.createInOrg({
              org: process.env.OWNER,
              name: process.env.PACKAGE,
              description,
              homepage: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              private: false,
              auto_init: true,
              has_issues: false,
              has_wiki: false,
              has_projects: false,
            });
            core.info(`Created repository ${process.env.OWNER}/${process.env.PACKAGE}.`);

      - name: 🪪 Retrieve Credentials (Configure Repository)
        id: credentials-configure
        uses: ./monorepo/actions/github-app-credentials
        with:
          app-id: ${{ secrets.SIMBO_ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ steps.options.outputs.package }}
          permission-administration: write

      - name: ⚙️ Configure Action Repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.options.outputs.package }}
          PACKAGE_JSON: monorepo/actions/${{ steps.options.outputs.package }}/package.json
          SCRIPT: monorepo/.github/scripts/configure-action-repository.js
        with:
          github-token: ${{ steps.credentials-configure.outputs.token }}
          script: |
            const { readFile } = await import('node:fs/promises');
            const { resolve } = await import('node:path');
            const { description } = JSON.parse(await readFile(process.env.PACKAGE_JSON, 'utf8'));
            const { configureActionRepository } = await import(resolve(process.env.SCRIPT));
            await configureActionRepository({
              github,
              core,
              owner: process.env.OWNER,
              repo: process.env.PACKAGE,
              description,
              homepage: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
            });

      - name: 🪪 Retrieve Credentials (Publish)
        id: credentials
        uses: ./monorepo/actions/github-app-credentials
        with:
          app-id: ${{ secrets.SIMBO_ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ steps.options.outputs.package }}
          permission-contents: write

      - name: 🛎️ Checkout Action Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.options.outputs.repository }}
          path: action-repo
          ref: main
          persist-credentials: false

      - name: 🔄 Replace Content
        env:
          FROM: ${{ steps.content.outputs.content }}
          TO: action-repo
        run: |
          set -euo pipefail
          find "$TO" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${FROM}/." "${TO}/"

      - name: 💾 Commit and Tag
        id: commit
        uses: ./monorepo/actions/signed-commit
        with:
          token: ${{ steps.credentials.outputs.token }}
          repository: ${{ steps.options.outputs.repository }}
          branch: main
          working-directory: action-repo
          message: 'ci(release): ${{ steps.options.outputs.tag }}'
          tags: ${{ steps.options.outputs.tag }}
          sync: false

      - name: 🎁 Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.options.outputs.package }}
          TAG: ${{ steps.options.outputs.tag }}
          NOTES: ${{ steps.content.outputs.notes }}
          ASSETS: ${{ steps.content.outputs.assets }}
          SCRIPT: monorepo/.github/scripts/publish-release.js
        with:
          github-token: ${{ steps.credentials.outputs.token }}
          script: |
            const { resolve } = await import('node:path');
            const { publishRelease } = await import(resolve(process.env.SCRIPT));
            await publishRelease({
              github,
              core,
              owner: process.env.OWNER,
              repo: process.env.PACKAGE,
              tag: process.env.TAG,
              name: `${process.env.PACKAGE} ${process.env.TAG}`,
              notesFile: process.env.NOTES,
              assetsDirectory: process.env.ASSETS,
            });
