name: Publish 🚚

#-------------------------------------------------------------------------------
# "Publish" Workflow
#
# Publishes a released action to its own repository "simbo-actions/<action>":
# builds the action, creates and configures the repository if necessary,
# commits the build artifacts as signed commit with the tag "v<version>",
# creates a GitHub release (draft, assets with build provenance, publish), and
# moves the major tag "v<major>" forward (not for prereleases).
# Every action in actions/<name> is published to <organization>/<name>.
#
# Two jobs: "build" installs and builds without any credentials and hands the
# release content over as artifact. "publish" runs no npm code; it uses the
# artifact and the published actions of this organization, pinned by SHA, with
# the app credentials, and every token is restricted to the repository and the
# permissions of the steps that use it.
#-------------------------------------------------------------------------------

on:
  push:
    tags:
      - '*/v*.*.*'
      - '!changelog/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package Name'
        required: true
      version:
        description: 'Version'
        required: true

permissions: {}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'workflow_dispatch'
          && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
          || github.ref_name
      )
    }}

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    )
  }}

env:
  REF_NAME: >
    ${{ github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    }}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.options.outputs.package }}
      version: ${{ steps.options.outputs.version }}
      tag: ${{ steps.options.outputs.tag }}
      repository: ${{ steps.options.outputs.repository }}
      description: ${{ steps.content.outputs.description }}
    steps:
      - name: 🔍 Parse Options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: options
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package || '' }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        with:
          script: |
            let package, version, ref;

            const event = process.env.EVENT_NAME;
            switch (event) {
              case 'workflow_dispatch':
                package = process.env.PACKAGE.trim();
                version = process.env.VERSION.trim();
                ref = `${package}/v${version}`;
                break;
              case 'push':
                ref = process.env.REF_NAME.trim();
                const parts = ref.split('/v');
                package = parts[0].trim();
                version = parts[1].trim();
                break;
              default:
                throw new Error(`Unsupported event: ${event}`);
            }

            if (!/^[\w-]+$/.test(package) || package === 'changelog') {
              throw new Error(`Invalid package name: "${package}"`);
            }
            if (!/^\d+\.\d+\.\d+(-.+)?$/.test(version)) {
              throw new Error(`Invalid version: "${version}"`);
            }
            if (ref !== `${package}/v${version}`) {
              throw new Error(`Invalid ref: "${ref}" (expected: "${package}/v${version}")`);
            }

            core.setOutput('package', package);
            core.setOutput('version', version);
            core.setOutput('ref', ref);
            core.setOutput('tag', `v${version}`);
            core.setOutput('repository', `${process.env.OWNER}/${package}`);

      - name: 🛎️ Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monorepo
          ref: refs/tags/${{ steps.options.outputs.ref }}
          persist-credentials: false

      - name: 🚛 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: monorepo/package.json

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml

      - name: 📥 Install
        working-directory: monorepo
        run: pnpm install --frozen-lockfile

      - name: 👷 Build
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm exec turbo run build --filter="$PACKAGE"

      - name: 🎁 Bundle
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm run --filter "$PACKAGE" --if-present bundle

      - name: 🧩 Assemble Release Content
        id: content
        env:
          FROM: monorepo/actions/${{ steps.options.outputs.package }}
          PACKAGE: ${{ steps.options.outputs.package }}
          VERSION: ${{ steps.options.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! -f "${FROM}/action.yml" ]]; then
            echo "::error title=Not an Action::${FROM}/action.yml does not exist."
            exit 1
          fi

          content=release/content
          assets=release/assets
          notes=release/notes.md
          mkdir -p "$content" "$assets"

          # Copy distribution artifacts
          if [[ -d "${FROM}/dist" ]]; then
            cp -R "${FROM}/dist" "${content}/"
          fi
          for file in README.md CHANGELOG.md LICENSE.md action.yml package.json; do
            if [[ ! -f "${FROM}/${file}" ]]; then
              echo "::error title=Missing File::${FROM}/${file} does not exist."
              exit 1
            fi
            cp "${FROM}/${file}" "${content}/"
          done

          # Create release assets
          archive="${PACKAGE}-v${VERSION}.tar.gz"
          tar --create --gzip --file "${assets}/${archive}" --directory "$content" --sort=name --owner=0 --group=0 --numeric-owner .
          (cd "$assets" && sha256sum "$archive" > SHA256SUMS)

          # Extract the release notes of this version from the changelog
          awk -v version="$VERSION" '
            $0 ~ "^## " version "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "${FROM}/CHANGELOG.md" > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "::error title=Missing Release Notes::No changelog section found for version ${VERSION}."
            exit 1
          fi

          # The description may contain any characters; a random delimiter keeps the
          # output intact.
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "description<<${delimiter}"
            jq -r '.description' "${FROM}/package.json"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: 🧰 Add Settings
        run: cp monorepo/.github/managed-repository-settings.yml release/

      - name: 📤 Upload Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 📥 Download Release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: 📜 Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/assets/*.tar.gz

      - name: 🔍 Check Action Repository
        id: repo-exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.build.outputs.repository }}
        run: |
          set -euo pipefail
          # Only "not found" means missing; any other error fails the step.
          if output="$(gh api "repos/${REPO}" --silent 2>&1)"; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<< "$output"; then
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Repository Check Failed::${output}"
            exit 1
          fi

      - name: 🔑 Get App Token (Create Repository)
        id: app-token-create
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: 🪄 Create Action Repository
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ needs.build.outputs.package }}
          DESCRIPTION: ${{ needs.build.outputs.description }}
        with:
          github-token: ${{ steps.app-token-create.outputs.token }}
          retries: 3
          script: |
            await github.rest.repos.createInOrg({
              org: process.env.OWNER,
              name: process.env.PACKAGE,
              description: process.env.DESCRIPTION,
              homepage: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              private: false,
              auto_init: true,
              has_issues: false,
              has_wiki: false,
              has_projects: false,
            });
            core.info(`Created repository ${process.env.OWNER}/${process.env.PACKAGE}.`);

      - name: 🔑 Get App Token (Configure Repository)
        id: app-token-configure
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ needs.build.outputs.package }}
          permission-administration: write

      - name: ⚙️ Apply Repository Settings
        uses: simbo-actions/apply-repository-settings@ac511f09c64b1d84332eceed7408591d1f00f72f # v1.0.0
        with:
          token: ${{ steps.app-token-configure.outputs.token }}
          repository: ${{ needs.build.outputs.repository }}
          config: release/managed-repository-settings.yml
          description: ${{ needs.build.outputs.description }}
          homepage: https://github.com/${{ github.repository }}
          topics: github-actions simbo-actions

      - name: 🔑 Get App Token (Publish)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ needs.build.outputs.package }}
          permission-contents: write

      - name: 🛎️ Checkout Action Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.build.outputs.repository }}
          path: action-repo
          ref: main
          persist-credentials: false

      - name: 🔄 Replace Content
        env:
          FROM: release/content
          TO: action-repo
        run: |
          set -euo pipefail
          find "$TO" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${FROM}/." "${TO}/"

      - name: 💾 Commit and Tag
        uses: simbo-actions/signed-commit@fe2015f4b29fa48148803a55e1434f90ebed17a4 # v1.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ needs.build.outputs.repository }}
          branch: main
          working-directory: action-repo
          message: 'ci(release): ${{ needs.build.outputs.tag }}'
          tags: ${{ needs.build.outputs.tag }}
          # A re-run after the commit only completes the tag.
          if-no-changes: ignore
          sync: false

      - name: 🎁 Create GitHub Release
        uses: simbo-actions/staged-release@55b2fc009be61055933751eb1a14e0357fcd22d2 # v1.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ needs.build.outputs.repository }}
          tag: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.package }} ${{ needs.build.outputs.tag }}
          body-file: release/notes.md
          assets: release/assets/*
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          # GitHub marks the highest stable version as latest, not a fix of an older major.
          make-latest: legacy
          # A re-run after publishing continues with the floating tags.
          if-released: skip

      - name: 🏷️ Move Floating Version Tags
        if: ${{ !contains(needs.build.outputs.version, '-') }}
        uses: simbo-actions/floating-version-tags@b8e8a639c9485a8ba1bae66dde7b88932d4b5b02 # v1.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ needs.build.outputs.repository }}
          tag: ${{ needs.build.outputs.tag }}
          major: true
          # The message says which release vX points to.
          annotated: true
