name: Publish 🚚

#-------------------------------------------------------------------------------
# "Publish" Workflow
#
# Publishes a released action to its own repository "simbo-actions/<action>":
# builds the action, creates and configures the repository if necessary,
# commits the build artifacts as signed commit with the tag "v<version>",
# creates a GitHub release (draft, assets with build provenance, publish), and
# moves the major tag "v<major>" forward (not for prereleases).
# Every action in actions/<name> is published to <organization>/<name>.
#
# Order matters: all third-party code (install, build) runs before the app
# credentials are retrieved. Every token is restricted to the repository and
# the permissions of the steps that use it.
#-------------------------------------------------------------------------------

on:
  push:
    tags:
      - '*/v*.*.*'
      - '!changelog/v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package Name'
        required: true
      version:
        description: 'Version'
        required: true

permissions: {}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'workflow_dispatch'
          && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
          || github.ref_name
      )
    }}

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    )
  }}

env:
  REF_NAME: >
    ${{ github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', github.event.inputs.package, github.event.inputs.version)
        || github.ref_name
    }}

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 🔍 Parse Options
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: options
        env:
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.package || '' }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
        with:
          script: |
            let package, version, ref;

            const event = process.env.EVENT_NAME;
            switch (event) {
              case 'workflow_dispatch':
                package = process.env.PACKAGE.trim();
                version = process.env.VERSION.trim();
                ref = `${package}/v${version}`;
                break;
              case 'push':
                ref = process.env.REF_NAME.trim();
                const parts = ref.split('/v');
                package = parts[0].trim();
                version = parts[1].trim();
                break;
              default:
                throw new Error(`Unsupported event: ${event}`);
            }

            if (!/^[\w-]+$/.test(package) || package === 'changelog') {
              throw new Error(`Invalid package name: "${package}"`);
            }
            if (!/^\d+\.\d+\.\d+(-.+)?$/.test(version)) {
              throw new Error(`Invalid version: "${version}"`);
            }
            if (ref !== `${package}/v${version}`) {
              throw new Error(`Invalid ref: "${ref}" (expected: "${package}/v${version}")`);
            }

            core.setOutput('package', package);
            core.setOutput('version', version);
            core.setOutput('ref', ref);
            core.setOutput('tag', `v${version}`);
            core.setOutput('repository', `${process.env.OWNER}/${package}`);

      - name: 🛎️ Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: monorepo
          ref: refs/tags/${{ steps.options.outputs.ref }}
          persist-credentials: false

      - name: 🚛 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: monorepo/package.json

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: monorepo/.nvmrc
          cache: pnpm
          cache-dependency-path: monorepo/pnpm-lock.yaml

      - name: 📥 Install
        working-directory: monorepo
        run: pnpm install --frozen-lockfile

      - name: 👷 Build
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: >
          pnpm exec turbo run build
          --filter="$PACKAGE"
          --filter=signed-commit
          --filter=apply-repository-settings
          --filter=staged-release
          --filter=floating-version-tags

      - name: 🎁 Bundle
        working-directory: monorepo
        env:
          PACKAGE: ${{ steps.options.outputs.package }}
        run: pnpm run --filter "$PACKAGE" --if-present bundle

      - name: 🧩 Assemble Release Content
        id: content
        env:
          FROM: monorepo/actions/${{ steps.options.outputs.package }}
          PACKAGE: ${{ steps.options.outputs.package }}
          VERSION: ${{ steps.options.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! -f "${FROM}/action.yml" ]]; then
            echo "::error title=Not an Action::${FROM}/action.yml does not exist."
            exit 1
          fi

          content="${RUNNER_TEMP}/release/content"
          assets="${RUNNER_TEMP}/release/assets"
          notes="${RUNNER_TEMP}/release/notes.md"
          mkdir -p "$content" "$assets"

          # Copy distribution artifacts
          if [[ -d "${FROM}/dist" ]]; then
            cp -R "${FROM}/dist" "${content}/"
          fi
          for file in README.md CHANGELOG.md LICENSE.md action.yml package.json; do
            if [[ ! -f "${FROM}/${file}" ]]; then
              echo "::error title=Missing File::${FROM}/${file} does not exist."
              exit 1
            fi
            cp "${FROM}/${file}" "${content}/"
          done

          # Create release assets
          archive="${PACKAGE}-v${VERSION}.tar.gz"
          tar --create --gzip --file "${assets}/${archive}" --directory "$content" --sort=name --owner=0 --group=0 --numeric-owner .
          (cd "$assets" && sha256sum "$archive" > SHA256SUMS)

          # Extract the release notes of this version from the changelog
          awk -v version="$VERSION" '
            $0 ~ "^## " version "$" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "${FROM}/CHANGELOG.md" > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "::error title=Missing Release Notes::No changelog section found for version ${VERSION}."
            exit 1
          fi

          echo "content=${content}" >> "$GITHUB_OUTPUT"
          echo "assets=${assets}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"
          echo "description=$(jq -r '.description' "${FROM}/package.json")" >> "$GITHUB_OUTPUT"

      - name: 📜 Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.content.outputs.assets }}/*.tar.gz

      - name: 🔍 Check Action Repository
        id: repo-exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.options.outputs.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}" --silent 2>/dev/null; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔑 Get App Token (Create Repository)
        id: app-token-create
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: 🪄 Create Action Repository
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ steps.options.outputs.package }}
          DESCRIPTION: ${{ steps.content.outputs.description }}
        with:
          github-token: ${{ steps.app-token-create.outputs.token }}
          retries: 3
          script: |
            await github.rest.repos.createInOrg({
              org: process.env.OWNER,
              name: process.env.PACKAGE,
              description: process.env.DESCRIPTION,
              homepage: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              private: false,
              auto_init: true,
              has_issues: false,
              has_wiki: false,
              has_projects: false,
            });
            core.info(`Created repository ${process.env.OWNER}/${process.env.PACKAGE}.`);

      - name: 🔑 Get App Token (Configure Repository)
        id: app-token-configure
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ steps.options.outputs.package }}
          permission-administration: write

      - name: ⚙️ Apply Repository Settings
        uses: ./monorepo/actions/apply-repository-settings
        with:
          token: ${{ steps.app-token-configure.outputs.token }}
          repository: ${{ steps.options.outputs.repository }}
          config: monorepo/.github/managed-repository-settings.json
          description: ${{ steps.content.outputs.description }}
          homepage: https://github.com/${{ github.repository }}
          topics: github-actions simbo-actions

      - name: 🔑 Get App Token (Publish)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: ${{ steps.options.outputs.package }}
          permission-contents: write

      - name: 🛎️ Checkout Action Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.options.outputs.repository }}
          path: action-repo
          ref: main
          persist-credentials: false

      - name: 🔄 Replace Content
        env:
          FROM: ${{ steps.content.outputs.content }}
          TO: action-repo
        run: |
          set -euo pipefail
          find "$TO" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${FROM}/." "${TO}/"

      - name: 💾 Commit and Tag
        uses: ./monorepo/actions/signed-commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ steps.options.outputs.repository }}
          branch: main
          working-directory: action-repo
          message: 'ci(release): ${{ steps.options.outputs.tag }}'
          tags: ${{ steps.options.outputs.tag }}
          sync: false

      - name: 🎁 Create GitHub Release
        uses: ./monorepo/actions/staged-release
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ steps.options.outputs.repository }}
          tag: ${{ steps.options.outputs.tag }}
          name: ${{ steps.options.outputs.package }} ${{ steps.options.outputs.tag }}
          body-file: ${{ steps.content.outputs.notes }}
          assets: ${{ steps.content.outputs.assets }}/*

      - name: 🏷️ Move Floating Version Tags
        if: ${{ !contains(steps.options.outputs.version, '-') }}
        uses: ./monorepo/actions/floating-version-tags
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ steps.options.outputs.repository }}
          tag: ${{ steps.options.outputs.tag }}
          major: true
