name: Auto-merge 🤖

#-------------------------------------------------------------------------------
# "Auto-merge" Workflow
#
# Merges Dependabot pull requests that only update simbo-actions/* actions and
# only change files under .github/, once the required checks pass.
# Assigns all other Dependabot pull requests to the owner.
#-------------------------------------------------------------------------------

on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 🔍 Fetch Dependabot Metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: 🧐 Check Pull Request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail

          result=true

          if [[ "$ECOSYSTEM" != 'github_actions' ]]; then
            result=false
          fi

          IFS=',' read -ra names <<< "$DEPENDENCIES"
          if [[ ${#names[@]} -eq 0 ]]; then
            result=false
          fi
          for name in "${names[@]}"; do
            name="$(echo "$name" | xargs)"
            if [[ "$name" != simbo-actions/* ]]; then
              result=false
            fi
          done

          if gh pr diff "$PR" --name-only | grep -qv '^\.github/'; then
            result=false
          fi

          echo "automerge=${result}" >> "$GITHUB_OUTPUT"

      - name: 🔀 Enable Auto-merge
        if: steps.check.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        # --auto fails once the PR is already mergeable; the ruleset still
        # enforces the required checks on the direct merge.
        run: gh pr merge "$PR" --auto --squash || gh pr merge "$PR" --squash

      - name: 🙋 Assign Owner
        if: steps.check.outputs.automerge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          OWNER: simbo
        run: gh pr edit "$PR" --add-assignee "$OWNER"
