name: Security 🛡️

#-------------------------------------------------------------------------------
# "Security" Workflow
#
# Scans all dependencies weekly with Google's osv-scanner workflow for known
# vulnerabilities, malicious packages, and licenses, so that newly published
# vulnerabilities in unchanged dependencies are found. Uploads the results to
# code scanning. Scans the whole Git history for secrets with the published
# gitleaks-scan action, pinned by SHA, so that new rules also check old commits. Pull requests and pushes to main
# are scanned by the "Checks" workflow, which scans only their commits for
# secrets.
#-------------------------------------------------------------------------------

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

run-name: >
  ${{
    format(
      '{0} ({1})',
      github.workflow,
      github.event_name == 'schedule' && 'weekly' || github.event_name
    )
  }}

jobs:
  vulnerabilities:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      # Same scan as "pnpm run check:vulnerabilities".
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --config=osv-scanner.toml
        --licenses=0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-3.0,CC-BY-4.0,CC-BY-SA-4.0,CC0-1.0,ISC,MIT,MPL-2.0,PSF-2.0,Python-2.0,WTFPL

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔐 Scan the Whole History for Secrets
        uses: simbo-actions/gitleaks-scan@340bdabc63869a5ba357b5af3e6d501ffafd9a55 # v1.0.2
        with:
          scope: history
