name: Checks 🧐

#-------------------------------------------------------------------------------
# "Checks" Workflow
#
# Runs tests, builds, and performs checks on pull requests and pushes to main,
# including a secret scan of the Git history (gitleaks-scan), license and
# vulnerability checks (Google's osv-scanner workflows; on pull requests, only
# new findings fail), and a smoke test of github-app-bot-user against the
# GitHub API.
# Requires a changeset in pull requests, except for Dependabot pull requests
# that only change workflows.
# Dispatches the release workflow if changesets are present on main branch.
# After a merged Dependabot update of npm dependencies, adds the changeset for
# the affected actions, which then triggers the release.
#-------------------------------------------------------------------------------

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.ref_name
      )
    }}

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'pull_request'
        && format('PR#{0} "{1}"', github.event.pull_request.number, github.event.pull_request.title)
        || format('Branch {0}', github.ref_name)
    )
  }}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.has-changesets.outputs.result }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🚛 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 👷‍♂️ Build
        run: pnpm run each:build

      - name: 🎁 Bundle
        run: pnpm run each:bundle

      - name: 🔐 Scan for Secrets
        uses: ./actions/gitleaks-scan

      - name: 🔎 Lint Workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          # Runs after the bundle: actionlint checks that dist/ of local actions exists.
          # Download actionlint and verify its checksum; shellcheck is preinstalled on the runner.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "$RUNNER_TEMP" actionlint

          "${RUNNER_TEMP}/actionlint" -color -shellcheck "$(command -v shellcheck)"

      - name: 👨‍🔬 Test
        run: pnpm run each:test

      - name: 👨‍🏫 Check
        run: pnpm run each:check

      - name: 🧐 Root Checks
        run: pnpm run check

      - name: 🤖 Smoke Test GitHub App Bot User
        id: bot-user
        uses: ./actions/github-app-bot-user
        with:
          app-slug: simbo-actions

      - name: 🔍 Verify GitHub App Bot User
        env:
          ID: ${{ steps.bot-user.outputs.id }}
          LOGIN: ${{ steps.bot-user.outputs.login }}
          NAME: ${{ steps.bot-user.outputs.name }}
          EMAIL: ${{ steps.bot-user.outputs.email }}
          AUTHOR: ${{ steps.bot-user.outputs.author }}
        run: |
          set -euo pipefail

          expected_email='355043706+simbo-actions[bot]@users.noreply.github.com'
          if [[ "$ID" != '355043706' \
            || "$LOGIN" != 'simbo-actions[bot]' \
            || "$NAME" != 'simbo-actions[bot]' \
            || "$EMAIL" != "$expected_email" \
            || "$AUTHOR" != "simbo-actions[bot] <${expected_email}>" ]]; then
            echo "::error title=Unexpected Bot User::id=${ID} login=${LOGIN} name=${NAME} email=${EMAIL} author=${AUTHOR}"
            exit 1
          fi
          echo "Bot user: ${AUTHOR} (ID ${ID})"

      - name: 📝 Require Changeset (Pull Requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          range="origin/${BASE_REF}...HEAD"

          if git diff --name-only --diff-filter=A "$range" -- '.changeset/*.md' | grep -q .; then
            echo 'Changeset found.'
            exit 0
          fi

          # Dependabot updates of workflows need no release. Dependabot updates of npm
          # dependencies get their changeset after the merge (job "dependency-changeset").
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]] \
            && ! git diff --name-only "$range" | grep -qvE '^(\.github/workflows/.+|(.+/)?package\.json|pnpm-lock\.yaml)$'; then
            echo 'Dependabot pull request changes only workflows or dependencies; no changeset required.'
            exit 0
          fi

          echo "::error title=Missing Changeset::Add a changeset (pnpm exec changeset, or --empty for changes without release)."
          exit 1

      - name: 🔍 Check for Changesets (Main Branch)
        id: has-changesets
        if: >
          github.event_name == 'push' &&
          github.ref_name == 'main'
        run: |
          set -euo pipefail
          result=$(find .changeset -type f -name '*.md' -print -quit 2>/dev/null | grep -q . && echo 'true' || echo 'false')
          echo "result=${result}" >> "$GITHUB_OUTPUT"

  vulnerabilities-pr:
    name: vulnerabilities (new findings)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Same scan as "pnpm run check:vulnerabilities".
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --config=osv-scanner.toml
        --licenses=0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-3.0,CC-BY-4.0,CC-BY-SA-4.0,CC0-1.0,ISC,MIT,MPL-2.0,Python-2.0,WTFPL

  vulnerabilities:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Same scan as "pnpm run check:vulnerabilities".
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --config=osv-scanner.toml
        --licenses=0BSD,Apache-2.0,BlueOak-1.0.0,BSD-2-Clause,BSD-3-Clause,CC-BY-3.0,CC-BY-4.0,CC-BY-SA-4.0,CC0-1.0,ISC,MIT,MPL-2.0,Python-2.0,WTFPL

  dispatch-release:
    needs:
      - checks
      - vulnerabilities
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.checks.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: '🎉 Workflow: Release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main

  dependency-changeset:
    needs: checks
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      github.event.head_commit.author.username == 'dependabot[bot]' &&
      needs.checks.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🚛 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: 👷 Build Signed Commit Action
        run: pnpm exec turbo run build --filter=signed-commit

      - name: 📝 Create Changeset for Dependency Updates
        id: changeset
        env:
          SHA: ${{ github.sha }}
        run: node tooling/bin/create-dependency-changeset.ts "$SHA"

      - name: 🔑 Get App Token
        id: app-token
        if: steps.changeset.outputs.created == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 💾 Commit Changeset
        if: steps.changeset.outputs.created == 'true'
        uses: ./actions/signed-commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: main
          message: 'chore(deps): add changeset for dependency updates'
          sync: false
