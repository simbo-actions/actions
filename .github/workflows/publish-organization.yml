name: Publish Organization 🏢

#-------------------------------------------------------------------------------
# "Publish Organization" Workflow
#
# Publishes the folder organization/ to the repository simbo-actions/.github:
# the organization profile and the default community files. Creates and
# configures the repository if necessary and commits the content as signed
# commit.
# Dispatched by the "Release" workflow for every release commit; manual runs
# are skipped. Every change on main has a changeset, so every change reaches
# the organization with the next release.
#
# Two jobs: "build" hands the content over as artifact, without any credentials.
# "publish" runs no npm code; it uses the artifact and the published actions of
# this organization, pinned by SHA, with the app credentials, and every token is
# restricted to the repository and the permissions of the steps that use it.
#-------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA of the release commit (set by "Release")'
        required: false
        default: ''
      commit:
        description: 'Short SHA of the release commit (set by "Release")'
        required: false
        default: ''
      subject:
        description: 'Subject of the release commit (set by "Release")'
        required: false
        default: ''

permissions: {}

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

run-name: >
  ${{
    inputs.commit != ''
      && format('{0} {1} "{2}"', github.workflow, inputs.commit, inputs.subject)
      || github.workflow
  }}

env:
  REPOSITORY: ${{ github.repository_owner }}/.github
  DESCRIPTION: A collection of GitHub Actions, each in its own repository and published from one monorepo by an automated release process.

jobs:
  build:
    # Only the dispatch by "Release" publishes; a manual run is skipped. A
    # re-run keeps the actor of the original run.
    if: github.ref == 'refs/heads/main' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Publishes the release commit, not the current main: its parent passed
      # "Checks", and "Release" only adds the released versions.
      - name: 🔎 Check the Commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Commit::Expected the full SHA of the release commit."
            exit 1
          fi

      - name: 🛎️ Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          path: monorepo
          persist-credentials: false

      - name: 🧰 Assemble Content
        run: |
          set -euo pipefail

          mkdir -p release
          cp -R monorepo/organization release/organization
          cp monorepo/.github/managed-repository-settings.yml release/

      - name: 📤 Upload Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 📥 Download Release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: 🔍 Check Organization Repository
        id: repo-exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only "not found" means missing; any other error fails the step.
          if output="$(gh api "repos/${REPOSITORY}" --silent 2>&1)"; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<< "$output"; then
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Repository Check Failed::${output}"
            exit 1
          fi

      - name: 🔑 Get App Token (Create Repository)
        id: app-token-create
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: 🪄 Create Organization Repository
        if: steps.repo-exists.outputs.result == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token-create.outputs.token }}
          retries: 3
          script: |
            const [org, name] = process.env.REPOSITORY.split('/');
            await github.rest.repos.createInOrg({
              org,
              name,
              description: process.env.DESCRIPTION,
              homepage: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              private: false,
              auto_init: true,
              has_issues: false,
              has_wiki: false,
              has_projects: false,
            });
            core.info(`Created repository ${process.env.REPOSITORY}.`);

      - name: 🔑 Get App Token (Configure Repository)
        id: app-token-configure
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: .github
          permission-administration: write

      - name: ⚙️ Apply Repository Settings
        uses: simbo-actions/apply-repository-settings@b1bbbdb8064d32f50f5fa816103c3466b40c6378 # v1.0.4
        with:
          token: ${{ steps.app-token-configure.outputs.token }}
          repository: ${{ env.REPOSITORY }}
          config: release/managed-repository-settings.yml
          description: ${{ env.DESCRIPTION }}
          homepage: https://github.com/${{ github.repository }}

      - name: 🔑 Get App Token (Publish)
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SIMBO_ACTIONS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_ACTIONS_APP_PRIVATE_KEY }}
          repositories: .github
          permission-contents: write

      - name: 🛎️ Checkout Organization Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REPOSITORY }}
          path: organization-repo
          ref: main
          persist-credentials: false

      - name: 🔄 Replace Content
        env:
          FROM: release/organization
          TO: organization-repo
        run: |
          set -euo pipefail
          find "$TO" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${FROM}/." "${TO}/"

      - name: 💾 Commit Changes
        uses: simbo-actions/signed-commit@b849fbd0c14db4ccfa873320255ecf4a56f53f88 # v2.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ env.REPOSITORY }}
          branch: main
          working-directory: organization-repo
          message: 'docs(organization): update profile and community files'
          if-no-changes: ignore
          sync: false
