# Settings of every generated repository: the action repositories and
# simbo-actions/.github. The publish workflows apply them on every run with
# apply-repository-settings, writing only what differs; manual changes in a
# generated repository are reset by the next publish.
#
# Description, homepage, and topics are set per repository by the workflows.
# See ARCHITECTURE.md, "Managing Action Repositories".

repository:
  # The repositories are written only by the publish process: issues,
  # pull requests, discussions, and contributions go to the monorepo.
  has_issues: false
  has_pull_requests: false
  has_wiki: false
  has_projects: false
  has_discussions: false
  # Merging stays restricted, should pull requests ever be enabled.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  allow_update_branch: true
  delete_branch_on_merge: true

security:
  secret_scanning: true
  secret_scanning_push_protection: true
  dependabot_alerts: true
  # The content is generated and overwritten by every publish; the source is
  # scanned and updated in the monorepo.
  dependabot_security_updates: false
  private_vulnerability_reporting: true

actions:
  # The repositories have no workflows; these settings take effect only if
  # one is ever added.
  enabled: true
  allowed_actions: all
  sha_pinning_required: true
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

rulesets:
  - name: Main Branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: [refs/heads/main]
        exclude: []
    # The GitHub App simbo-actions (ID 5701490) publishes; organization
    # admins can repair. Nobody else can write.
    bypass_actors:
      - actor_id: 5701490
        actor_type: Integration
        bypass_mode: always
      - actor_id: 1
        actor_type: OrganizationAdmin
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: required_signatures
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          allowed_merge_methods: [squash]

  # Release tags vX.Y.Z and the floating tags vX: only the publish process
  # creates and moves them.
  - name: Release Tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include: [refs/tags/v*]
        exclude: []
    bypass_actors:
      - actor_id: 5701490
        actor_type: Integration
        bypass_mode: always
      - actor_id: 1
        actor_type: OrganizationAdmin
        bypass_mode: always
    rules:
      - type: creation
      - type: update
      - type: deletion

# Switched on once the release process is established; a published version is
# then final.
immutable_releases: false
